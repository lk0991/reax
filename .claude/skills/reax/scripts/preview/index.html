<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>reax preview</title>
<style>
  /* The reax live preview: Storybook's own frame inside, our review tools around it. */
  :root {
    /* chrome of the tool: neutral, with one accent kept for the active mode and the selected element */
    --ui-bg:#eef0f3; --ui-panel:#ffffff; --ui-ink:#1c2026; --ui-muted:#566070; --ui-line:#d3d8e0; --ui-wash:#f5f6f8;
    --accent:#5b3fd0; --accent-wash:rgba(91,63,208,.12);
    --ok:#1b7a43; --ok-wash:#e4f4ea; --bad:#a3262b; --bad-wash:#fbe5e6; --warn:#8a5a00; --warn-wash:#fdf1d6; --info:#1f4f9a; --info-wash:#e6eefb;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scrollbar-color: #b7bdc8 transparent; }
  body { margin:0; background:var(--ui-bg); color:var(--ui-ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  ::selection { background:var(--accent-wash); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* header: mode switch always visible; viewport controls collapse on phones */
  .bar { background:var(--ui-panel); border-bottom:1px solid var(--ui-line); position:sticky; top:0; z-index:20; padding:8px 16px; }
  .bar-row { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; }
  .pill { font-size:11px; font-weight:700; letter-spacing:.04em; background:var(--warn-wash); color:var(--warn); padding:2px 8px; border-radius:999px; }
  .seg { display:inline-flex; border:1px solid var(--ui-line); border-radius:8px; overflow:hidden; background:#fff; }
  .seg button { border:0; background:transparent; padding:7px 12px; font:inherit; cursor:pointer; color:var(--ui-ink); min-height:32px; }
  .seg button + button { border-left:1px solid var(--ui-line); }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  #controls summary { cursor:pointer; padding:6px 0; color:var(--ui-muted); }
  .controls { display:flex; flex-wrap:wrap; gap:10px 22px; padding:6px 0 4px; align-items:center; }
  .cluster { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
  .readout { color:var(--ui-muted); font-variant-numeric:tabular-nums; min-width:84px; }
  .chk { display:inline-flex; gap:6px; align-items:center; }
  @media (min-width:900px) { #controls summary { display:none; } }

  .b { border:1px solid var(--ui-line); background:#fff; color:var(--ui-ink); border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; min-height:32px; }
  .b:hover { background:var(--ui-wash); }
  .b.pri { background:var(--ui-ink); border-color:var(--ui-ink); color:#fff; }
  .b.pri:hover { background:#000; }
  .b.sm { padding:3px 10px; min-height:28px; font-size:13px; }
  .b:disabled { opacity:.45; cursor:not-allowed; }
  select, input[type=text], input[type=number], textarea { font:inherit; padding:5px 8px; border:1px solid var(--ui-line); border-radius:6px; background:#fff; color:var(--ui-ink); min-height:32px; }
  input[type=number] { width:76px; }
  textarea { width:100%; min-height:64px; }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; min-height:calc(100vh - 56px); }
  .stage-wrap { padding:16px 24px 24px; min-width:0; }
  .banner { display:flex; gap:12px; align-items:center; justify-content:space-between; background:var(--info-wash); color:var(--info); border-radius:8px; padding:6px 12px; margin-bottom:12px; font-size:13px; }
  .stage-top { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; min-height:34px; margin-bottom:8px; }
  .chip { background:var(--ui-ink); color:#fff; font-size:12px; padding:3px 10px; border-radius:999px; }
  .note { color:var(--ui-muted); font-size:13px; margin:0; text-wrap:pretty; }
  .draftpill { background:var(--warn-wash); color:var(--warn); font-size:13px; padding:3px 10px; border-radius:999px; font-weight:600; }

  .frame-wrap { position:relative; width:max-content; padding-right:16px; }
  .frame-wrap.gutter { margin-left:44px; padding-right:60px; }
  #scaler { position:relative; }
  #frame { position:absolute; left:0; top:0; background:#8b909a; overflow:hidden; border:1px solid #5f6672; border-radius:6px; transform-origin:0 0; }
  #stage { position:absolute; inset:0; }
  #sb { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
  #handle { position:absolute; top:0; right:0; width:16px; height:100%; cursor:ew-resize; display:grid; place-items:center; touch-action:none; border-radius:4px; }
  #handle::after { content:""; width:4px; height:48px; border-radius:2px; background:var(--ui-muted); }
  #handle:hover::after, #handle:focus-visible::after { background:var(--accent); }
  #overlay { position:absolute; inset:0; pointer-events:none; }
  #hl { position:absolute; display:none; border:2px dashed var(--accent); background:var(--accent-wash); z-index:3; }
  #sel { position:absolute; display:none; border:2px solid var(--accent); z-index:4; }
  .badge { pointer-events:auto; cursor:pointer; position:absolute; min-width:20px; height:20px; padding:0 5px; border-radius:10px; background:var(--ui-ink); color:#fff; font-size:12px; display:grid; place-items:center; transform:translate(-50%,-50%); z-index:5; font-variant-numeric:tabular-nums; }
  .pin { position:absolute; min-width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; display:grid; place-items:center; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.35); z-index:6; border:2px solid #fff; }
  .pin.addressed { background:var(--warn); }
  .pin.resolved { background:#fff; color:var(--ok); border-color:var(--ok); }
  .pin.hot { outline:3px solid var(--accent); outline-offset:2px; }

  /* review rail: right column on desktop, bottom sheet on phones */
  #rail { background:var(--ui-panel); border-left:1px solid var(--ui-line); min-width:0; display:flex; flex-direction:column; }
  #panel { padding:16px; overflow:auto; flex:1; }
  .sheet-bar { display:none; }
  #panel h3 { margin:18px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ui-muted); }
  #panel h3:first-child { margin-top:0; }
  .row { display:grid; grid-template-columns:84px minmax(0,1fr); gap:8px; align-items:center; margin:6px 0; }
  .row select, .row input[type=text] { width:100%; min-width:0; }
  .card { border:1px solid var(--ui-line); border-radius:8px; padding:8px 10px; margin:8px 0; background:var(--ui-wash); }
  .comment { border:1px solid var(--ui-line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  .comment:hover { border-color:var(--accent); }
  .card-h { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  code { font:12px ui-monospace,monospace; background:#eceef2; padding:1px 4px; border-radius:4px; overflow-wrap:anywhere; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:#eceef2; font-weight:600; }
  .tag.open { background:var(--info-wash); color:var(--info); } .tag.addressed { background:var(--warn-wash); color:var(--warn); } .tag.resolved { background:var(--ok-wash); color:var(--ok); }
  .alert { background:var(--bad-wash); color:var(--bad); border-radius:8px; padding:6px 10px; margin:6px 0; font-size:13px; }
  .caution { background:var(--warn-wash); color:var(--warn); border-radius:8px; padding:6px 10px; margin:6px 0; font-size:13px; }
  .good { background:var(--ok-wash); color:var(--ok); border-radius:8px; padding:6px 10px; margin:6px 0; font-size:13px; }
  .tabs { display:flex; gap:2px; border-bottom:1px solid var(--ui-line); margin:8px 0; }
  .tabs button { border:0; background:transparent; padding:6px 10px; font:inherit; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--ui-muted); }
  .tabs button[aria-selected="true"] { border-bottom-color:var(--accent); color:var(--ui-ink); font-weight:600; }
  details.more { margin:8px 0; } details.more summary { cursor:pointer; color:var(--ui-muted); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  /* stacked rows instead of columns: nothing depends on the rail's width, long values wrap */
  .list .item { padding:8px 0; border-bottom:1px solid var(--ui-line); }
  .item-h { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; }
  .item-h .tag { margin-left:auto; }
  .tag.bad { background:var(--bad-wash); color:var(--bad); }
  .tag.warn { background:var(--warn-wash); color:var(--warn); }
  .grp { margin:14px 0 4px; font-size:13px; }
  .sw { display:inline-block; width:14px; height:14px; border-radius:3px; border:1px solid var(--ui-line); align-self:center; }
  #panel { overflow-wrap:anywhere; } /* a 150-character name with no spaces must not push the rail wider */
  .num { display:inline-grid; place-items:center; min-width:20px; height:20px; border-radius:10px; background:var(--ui-ink); color:#fff; font-size:12px; font-variant-numeric:tabular-nums; align-self:center; }
  .val { margin-top:4px; }
  .badge.hot { outline:3px solid var(--accent); outline-offset:2px; }
  /* a part row is a button, with a full border and a tint when selected */
  .list .item-btn { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:none; cursor:pointer; border:1px solid transparent; border-bottom-color:var(--ui-line); border-radius:6px; padding:8px; }
  .list .item-btn:hover, .list .item-btn:focus-visible { background:var(--ui-wash); }
  .list .item-btn.sel { background:var(--accent-wash); border-color:var(--accent); }
  .item-btn .item-h { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
  .item-btn .note { display:block; margin-top:2px; }
  .banner .short { display:none; }

  @media (max-width:899px) {
    .bar { padding:6px 12px; }
    .layout { grid-template-columns:minmax(0,1fr); }
    .stage-wrap { padding:12px 12px 84px; }
    #rail { position:fixed; left:0; right:0; bottom:0; max-height:56vh; z-index:30; border-left:0; border-top:1px solid var(--ui-line); box-shadow:0 -8px 24px rgba(0,0,0,.14); transform:translateY(calc(100% - 52px)); transition:transform .22s cubic-bezier(.16,1,.3,1); }
    #rail.open { transform:none; }
    #rail.compact { max-height:40vh; } /* Parts is a diagram-to-list task: keep the frame in view above the sheet */
    .banner { padding:4px 8px 4px 12px; margin-bottom:8px; } .banner .long { display:none; } .banner .short { display:inline; }
    .sheet-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:52px; padding:0 16px; border:0; background:var(--ui-panel); font:inherit; font-weight:600; color:var(--ui-ink); cursor:pointer; text-align:left; }
    .chev { width:10px; height:10px; border-right:2px solid var(--ui-muted); border-bottom:2px solid var(--ui-muted); transform:rotate(-135deg); transition:transform .2s; }
    #rail.open .chev { transform:rotate(45deg); }
  }
  @media (pointer:coarse) { .b.sm, .tabs button, .seg button, select, input[type=number] { min-height:40px; } }
  @media (prefers-reduced-motion:reduce) { #rail, .chev { transition:none; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-row">
    <h1>reax preview</h1><span class="note" id="project"></span>
    <div class="seg" id="modes" role="group" aria-label="Mode">
      <button type="button" data-mode="test" aria-pressed="true" aria-keyshortcuts="1" title="Test (1)">Test</button>
      <button type="button" data-mode="comment" aria-pressed="false" aria-keyshortcuts="2" title="Comment (2)">Comment</button>
      <button type="button" data-mode="anatomy" aria-pressed="false" aria-keyshortcuts="3" title="Anatomy (3)">Anatomy</button>
      <button type="button" data-mode="edit" aria-pressed="false" aria-keyshortcuts="4" title="Edit (4)">Edit</button>
    </div>
  </div>
  <details id="controls" open>
    <summary>Width, text size and story</summary>
    <div class="controls">
      <div class="cluster" role="group" aria-label="Viewport">
        <div class="seg" id="presets" role="group" aria-label="Width presets">
          <button type="button" data-w="320" aria-pressed="false">320</button>
          <button type="button" data-w="390" aria-pressed="true">390</button>
          <button type="button" data-w="768" aria-pressed="false">768</button>
          <button type="button" data-w="1280" aria-pressed="false">1280</button>
        </div>
        <label>Width <input type="number" id="wInput" min="180" max="1600" step="10" inputmode="numeric"> px</label>
        <span class="readout" id="readout"></span>
        <label class="chk"><input type="checkbox" id="t200"> 200% text</label>
      </div>
      <div class="cluster">
        <label>Story <select id="story"></select></label>
        <button class="b" id="sweep" type="button">Find narrowest width</button>
      </div>
    </div>
  </details>
</header>
<main class="layout">
  <section class="stage-wrap" id="stageWrap" aria-label="Preview">
    <div id="demoBanner" class="banner" hidden><span class="long">The preview helper stopped answering. Comments and edits cannot be saved until you run the preview again.</span><span class="short">The helper stopped answering.</span></div>
    <div class="stage-top"><span class="chip" id="chip"></span><span class="note" id="scaleNote"></span><span id="draftStrip"></span></div>
    <div class="frame-wrap" id="fw">
      <div id="scaler"><div id="frame"><div id="stage"><iframe id="sb" title="Component preview" src="about:blank"></iframe></div></div></div>
      <div id="handle" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Preview width" aria-valuemin="180" aria-valuemax="1600"></div>
      <div id="overlay" aria-hidden="true"><div id="hl"></div><div id="sel"></div><div id="badges"></div><div id="pins"></div></div>
    </div>
    <p class="note" style="margin-top:10px">Drag the handle, or focus it and press the arrow keys (Shift for 50px), to resize. Keys 1 to 4 switch mode, Esc deselects.</p>
  </section>
  <aside id="rail" aria-label="Review panel">
    <button type="button" class="sheet-bar" id="sheetBar" aria-expanded="false" aria-controls="panel"><span id="sheetTitle"></span><span class="chev" aria-hidden="true"></span></button>
    <div id="panel"></div>
  </aside>
</main>
<div class="sr" id="status" role="status" aria-live="polite"></div>

<script>
const BOOT = "__REAX_BOOT__";
const TOKEN = BOOT.token;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const api = async (path, method = 'GET', body) => {
  try {
    const r = await fetch('/__reax/api' + path, { method, headers: { 'x-token': TOKEN, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error(String(r.status));
    $('#demoBanner').hidden = true;
    return await r.json();
  } catch (e) { $('#demoBanner').hidden = false; throw e; }
};

/* The design tokens are the CSS custom properties the project already defines. They are read from the story's own page,
   so the values are the project's, whatever file they came from (DESIGN.md names them, the token files own the values). */
const GROUPS = { color: ['--color-'], padding: ['--space-', '--spacing-'], borderRadius: ['--radius-', '--rounded-'], fontSize: ['--text-', '--font-size-'], size: ['--size-'] };
let TOKENS = { color: {}, padding: {}, borderRadius: {}, fontSize: {}, size: {} }; /* group -> name -> { raw, value } */
const FLOOR = 24, FRAME_H = 520, MIN_W = 180, MAX_W = 1600;
const FIELDS = {
  padding: { key: 'padding', label: 'Padding', group: 'padding' }, borderRadius: { key: 'borderRadius', label: 'Radius', group: 'borderRadius' },
  fontSize: { key: 'fontSize', label: 'Text size', group: 'fontSize' }, color: { key: 'color', label: 'Text colour', group: 'color' },
  backgroundColor: { key: 'backgroundColor', label: 'Background', group: 'color' }, height: { key: 'height', label: 'Height', group: 'size' }, width: { key: 'width', label: 'Width', group: 'size' },
};
const PRIMARY = ['padding', 'borderRadius', 'fontSize', 'color', 'backgroundColor'], MORE = ['height', 'width'];
const MODE_LABEL = { test: 'Test', comment: 'Comment', anatomy: 'Anatomy', edit: 'Edit' };
const state = { mode: 'test', view: 'parts', width: 390, scale: 1, frameH: FRAME_H, t200: false, story: BOOT.initial, stories: [], selected: null, comments: [], viewports: [], draft: [], viewingOriginal: false, sweep: null, receipt: null, args: null, argTypes: null };
const frame = $('#frame'), sb = $('#sb'), panel = $('#panel'), hl = $('#hl'), sel = $('#sel'), pins = $('#pins'), badges = $('#badges'), rail = $('#rail');
let stage = null, sdoc = null; /* the story's root element and document, set on each load */
const announce = (m) => { $('#status').textContent = ''; setTimeout(() => ($('#status').textContent = m), 30); };

/* Everything on the page reads the story through Storybook's own frame (ADR 0003). */
const irect = () => sb.getBoundingClientRect();
/** An element's box in the page's coordinates. Boxes inside the frame are in the frame's own pixels, shown at the frame's scale. */
function rectOf(el) { const r = el.getBoundingClientRect(), ir = irect(), S = state.scale; return { left: ir.left + r.left * S, right: ir.left + r.right * S, top: ir.top + r.top * S, bottom: ir.top + r.bottom * S, width: r.width * S, height: r.height * S }; }
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])';
const slots = () => (stage ? $$('[data-slot]', stage) : []);

function loadStory(id) {
  state.story = id; state.draft = []; state.viewingOriginal = false; state.selected = null; state.sweep = null; state.argTypes = null; state.args = null; stage = null; sdoc = null;
  sb.src = `/iframe.html?id=${encodeURIComponent(id)}&viewMode=story`;
  $('#story').value = id; drawOverlay(); updateStageTop(); renderPanel();
}
let storyObservers = [];
async function onFrameLoad() {
  if (!sb.contentDocument || sb.src === 'about:blank' || sb.contentDocument.location.href === 'about:blank') return;
  storyObservers.forEach((o) => o.disconnect()); storyObservers = [];
  sdoc = sb.contentDocument;
  /* Storybook adds sb-show-main once the story has rendered */
  for (let i = 0; i < 100 && !(sdoc.body.classList.contains('sb-show-main') || sdoc.body.classList.contains('sb-show-errordisplay')); i++) await new Promise((r) => setTimeout(r, 100));
  stage = sdoc.getElementById('storybook-root') || sdoc.body;
  const st = sdoc.createElement('style'); st.id = 'reax-style';
  st.textContent = 'html.reax-parts [data-slot]{outline:1.5px dashed #1c2026!important;outline-offset:1px}*,*::before,*::after{caret-color:auto}';
  sdoc.head.appendChild(st);
  sdoc.documentElement.style.fontSize = state.t200 ? '200%' : '';
  sdoc.documentElement.classList.toggle('reax-parts', state.mode === 'anatomy' && state.view === 'parts');
  sdoc.addEventListener('mousemove', onMove); sdoc.addEventListener('mouseleave', () => (hl.style.display = 'none')); sdoc.addEventListener('click', onClick, true);
  let raf = 0; const redraw = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawOverlay(); if (state.mode === 'anatomy' && slots().length !== state.slotCount) renderPanel(); }); };
  const mo = new MutationObserver(redraw); mo.observe(stage, { subtree: true, childList: true, attributes: true }); storyObservers.push(mo);
  const ro = new ResizeObserver(redraw); ro.observe(sdoc.documentElement); storyObservers.push(ro);
  buildTokens(); state.slotCount = slots().length;
  reapplyDraft(false);
  readArgTypes();
  drawOverlay(); updateStageTop(); renderPanel();
}
sb.addEventListener('load', onFrameLoad);
/* props: Storybook already knows them. Ask its preview for this story's argTypes and args. */
async function readArgTypes() {
  try {
    const store = sb.contentWindow.__STORYBOOK_PREVIEW__.storyStoreValue; const story = await store.loadStory({ storyId: state.story });
    state.argTypes = story.argTypes || {}; state.args = story.args || story.initialArgs || {};
  } catch { state.argTypes = null; state.args = null; }
  if (state.mode === 'anatomy' && state.view === 'props') renderPanel();
}
/* a probe in the story's own document turns any token (rem, em, px, colour names) into the value the story sees right now */
function buildTokens() {
  const probe = sdoc.createElement('div'); probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none'; sdoc.body.appendChild(probe);
  const names = new Set();
  for (const sheet of sdoc.styleSheets) { let rules; try { rules = sheet.cssRules; } catch { continue; } const walk = (rs) => { for (const r of rs) { if (r.cssRules && !r.style) walk(r.cssRules); if (r.style) for (const n of r.style) if (n.startsWith('--')) names.add(n); } }; walk(rules); }
  const rootStyle = sdoc.defaultView.getComputedStyle(sdoc.documentElement); const next = { color: {}, padding: {}, borderRadius: {}, fontSize: {}, size: {} };
  for (const n of [...names].sort()) {
    const group = Object.keys(GROUPS).find((g) => GROUPS[g].some((p) => n.startsWith(p))); if (!group) continue;
    const raw = rootStyle.getPropertyValue(n).trim(); if (!raw) continue;
    probe.style.cssText = 'position:absolute;visibility:hidden;'; let value;
    if (group === 'color') { probe.style.color = raw; value = probe.style.color ? hex(rgb(sdoc.defaultView.getComputedStyle(probe).color)) : null; }
    else { probe.style.width = raw; value = probe.style.width ? px(sdoc.defaultView.getComputedStyle(probe).width) : null; }
    if (value) next[group][n] = { raw, value };
  }
  probe.remove(); TOKENS = next;
}
/* ---------- element helpers ---------- */
const slotOf = (el) => (el && el.closest ? el.closest('[data-slot]') : null);
const textOwn = (el) => [...el.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join('').trim();
function selectorOf(el) {
  const slot = el.dataset.slot; const same = $(`[data-slot="${slot}"]`, stage);
  return same.length > 1 ? `[data-slot="${slot}"]:nth(${same.indexOf(el) + 1})` : `[data-slot="${slot}"]`;
