<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog/Confirm story (PROTOTYPE fixture with deliberate defects)</title>
<style>
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#e9ecf1;color:#15171c}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
  .dialog{background:#fff;border-radius:12px;padding:20px;max-width:520px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  h2{margin:0;font-size:1.25rem}
  .close{width:20px;height:20px;border:0;background:#d9dde4;border-radius:4px;padding:0}
  p{color:#454c58}
  .footer{display:flex;gap:12px;margin-top:20px}
  .footer button{width:180px;height:44px;border-radius:8px;border:1px solid #9aa2b1;background:#fff;font:inherit}
  .footer .primary{background:#1f4f9a;color:#fff;border-color:#1f4f9a}
</style></head>
<body>
<div class="backdrop">
  <div class="dialog" role="dialog" aria-modal="true" id="confirm-dialog">
    <div class="head"><h2>Delete project?</h2><button class="close" type="button"></button></div>
    <p>This removes the project and its 14 components. You can restore it from the archive for 30 days.</p>
    <div class="footer"><button type="button">Cancel</button><button type="button" class="primary">Delete project</button></div>
  </div>
</div>
</body></html>
