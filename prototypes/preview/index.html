<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reax preview (PROTOTYPE)</title>
<style>
  /* PROTOTYPE, throwaway. Interaction sketch of the reax live preview (ticket #13/#14). */
  :root {
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
    --radius-sm:4px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;
    --text-sm:.875em; --text-base:1em; --text-lg:1.25em; --text-xl:1.5em;
    --size-16:16px; --size-20:20px; --size-24:24px; --size-32:32px; --size-44:44px;
    --color-surface:#ffffff; --color-text:#15171c; --color-muted:#454c58; --color-primary:#1f4f9a;
    --color-danger:#b3261e; --color-border:#9aa2b1; --color-subtle:#d9dde4; --color-warn:#8a5a00;
    --ui-bg:#f2f4f7; --ui-panel:#ffffff; --ui-text:#15171c; --ui-muted:#566070; --ui-line:#d4d9e1;
    --accent:#6b3fd4; --ok:#1b7a43; --bad:#a3262b; --warnc:#8a5a00;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ui-bg); color:var(--ui-text); font:14px/1.45 system-ui,-apple-system,sans-serif; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:10px 16px; background:var(--ui-panel); border-bottom:1px solid var(--ui-line); position:sticky; top:0; z-index:5; }
  .pill { font-size:11px; font-weight:700; letter-spacing:.04em; background:#fdf1d6; color:var(--warnc); padding:2px 8px; border-radius:999px; }
  .seg { display:inline-flex; border:1px solid var(--ui-line); border-radius:8px; overflow:hidden; }
  .seg button { border:0; background:transparent; padding:6px 12px; font:inherit; cursor:pointer; color:var(--ui-text); }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  button.plain { border:1px solid var(--ui-line); background:#fff; border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  button.primary { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:8px; padding:6px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  select, input[type=text], textarea { font:inherit; padding:5px 8px; border:1px solid var(--ui-line); border-radius:6px; background:#fff; color:var(--ui-text); }
  textarea { width:100%; min-height:64px; }
  .row select, .row input[type=text] { width:100%; min-width:0; }
  .layout { display:grid; grid-template-columns: 1fr 340px; min-height:calc(100vh - 52px); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .stage-wrap { padding:24px; overflow:auto; }
  .frame-wrap { position:relative; width:max-content; margin:0 auto 0 0; padding-right:16px; }
  #frame { position:relative; width:390px; height:520px; background:#8b909a; overflow:hidden; border:1px solid #5f6672; border-radius:6px; }
  #frame.t200 #stage { font-size:200%; }
  #stage { font-size:16px; position:absolute; inset:0; display:grid; place-items:center; padding:12px; font-family:system-ui,sans-serif; color:var(--color-text); }
  #handle { position:absolute; top:0; right:0; width:16px; height:100%; cursor:ew-resize; display:grid; place-items:center; touch-action:none; }
  #handle::after { content:""; width:4px; height:48px; border-radius:2px; background:var(--accent); }
  #pins { position:absolute; inset:0; pointer-events:none; }
  .pin { position:absolute; width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff; font-size:12px; display:grid; place-items:center; transform:translate(-50%,-50%); box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pin.resolved { background:var(--ok); }
  #hl { position:absolute; pointer-events:none; border:2px solid var(--accent); background:rgba(107,63,212,.12); display:none; z-index:3; }
  .readout { color:var(--ui-muted); font-variant-numeric:tabular-nums; }
  aside { background:var(--ui-panel); border-left:1px solid var(--ui-line); padding:16px; overflow:auto; }
  aside h3 { margin:16px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ui-muted); }
  aside h3:first-child { margin-top:0; }
  .row { display:grid; grid-template-columns:110px 1fr; gap:8px; align-items:center; margin:6px 0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--ui-line); vertical-align:top; }
  code { font:12px ui-monospace,monospace; background:#eef0f4; padding:1px 4px; border-radius:4px; word-break:break-all; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:#eef0f4; }
  .tag.open { background:#e6eefb; color:#1f4f9a; } .tag.addressed { background:#fdf1d6; color:var(--warnc); } .tag.resolved { background:#e4f4ea; color:var(--ok); }
  .warn { background:#fbe5e6; color:var(--bad); border-radius:8px; padding:6px 10px; margin:6px 0; font-size:13px; }
  .good { background:#e4f4ea; color:var(--ok); border-radius:8px; padding:6px 10px; margin:6px 0; font-size:13px; }
  .note { color:var(--ui-muted); font-size:13px; }
  .comment { border:1px solid var(--ui-line); border-radius:8px; padding:8px 10px; margin:8px 0; }
  .parts [data-slot] { outline:1.5px dashed var(--accent); outline-offset:1px; position:relative; }
  .parts [data-slot]::after { content:attr(data-slot); position:absolute; top:-10px; left:4px; font:10px/1.4 ui-monospace,monospace; background:var(--accent); color:#fff; padding:0 4px; border-radius:3px; pointer-events:none; z-index:2; }

  /* The component under test: Dialog / Confirm. Uses tokens, em-based type so 200% text scales. */
  .dialog { background:var(--color-surface); color:var(--color-text); border-radius:var(--radius-lg); padding:var(--space-5); width:100%; max-width:520px; box-shadow:0 12px 40px rgba(0,0,0,.3); }
  .dialog-head { display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-3); }
  .dialog-title { margin:0; font-size:var(--text-lg); line-height:1.25; }
  .dialog-close { width:var(--size-32); height:var(--size-32); border:0; border-radius:var(--radius-sm); background:var(--color-subtle); font-size:1.1em; line-height:1; cursor:pointer; flex:none; }
  .dialog-body { margin:var(--space-3) 0 0; color:var(--color-muted); font-size:var(--text-base); }
  .dialog-foot { display:flex; flex-wrap:wrap; gap:var(--space-3); margin-top:var(--space-5); }
  .dialog .btn { min-width:140px; min-height:var(--size-44); padding:0 var(--space-4); border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text); font:inherit; cursor:pointer; }
  .dialog .btn.primary { background:var(--color-primary); border-color:var(--color-primary); color:#fff; }
  .dialog .btn.danger { background:var(--color-danger); border-color:var(--color-danger); color:#fff; }
</style>
</head>
<body>
<header class="bar">
  <strong>reax preview</strong><span class="pill">PROTOTYPE</span>
  <div class="seg" id="modes" role="group" aria-label="Mode">
    <button type="button" data-mode="test" aria-pressed="true">Test</button>
    <button type="button" data-mode="comment" aria-pressed="false">Comment</button>
    <button type="button" data-mode="anatomy" aria-pressed="false">Anatomy</button>
    <button type="button" data-mode="edit" aria-pressed="false">Edit</button>
  </div>
  <label>Story <select id="story"><option value="short">Dialog/Confirm</option><option value="long">Dialog/Confirm (long text)</option></select></label>
  <div class="seg" id="presets" role="group" aria-label="Width presets">
    <button type="button" data-w="320" aria-pressed="false">320</button>
    <button type="button" data-w="390" aria-pressed="true">390</button>
    <button type="button" data-w="1280" aria-pressed="false">1280</button>
  </div>
  <label><input type="checkbox" id="t200"> 200% text</label>
  <span class="readout" id="readout"></span>
  <button class="plain" id="sweep" type="button">Find narrowest working width</button>
</header>
<div class="layout">
  <section class="stage-wrap">
    <div class="frame-wrap">
      <div id="frame">
        <div id="stage"></div>
      </div>
      <div id="handle" role="separator" aria-orientation="vertical" aria-label="Resize preview width"></div>
      <div id="pins"></div>
      <div id="hl"></div>
    </div>
    <p class="note">Drag the purple handle to resize the frame. Test mode lets you use the component; the other modes select elements instead.</p>
  </section>
  <aside id="panel" aria-live="polite"></aside>
</div>

<script>
const TOKEN = '__TOKEN__';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* Without the helper server (for example the hosted demo) the same routes run in memory, so everything can still be tried. */
const mem = { comments: [], viewports: [], edits: [] };
function memApi(path, method, body) {
  if (path === '/state') return { comments: [...mem.comments], viewports: [...mem.viewports] };
  if (method === 'POST' && path === '/comments') { const c = { id: 'c' + (mem.comments.length + 1), status: 'open', createdAt: new Date().toISOString(), ...body }; mem.comments.push(c); return c; }
  const m = path.match(/^\/comments\/(c\d+)$/);
  if (method === 'PATCH' && m) { const c = mem.comments.find((x) => x.id === m[1]); Object.assign(c, body); return c; }
  if (method === 'POST' && path === '/viewports') { if (!mem.viewports.includes(body.width)) mem.viewports.push(body.width); return mem.viewports; }
  if (method === 'POST' && path === '/apply') { const e = { id: 'e' + (mem.edits.length + 1), ...body }; mem.edits.push(e); return e; }
  return {};
}
const api = async (path, method = 'GET', body) => {
  try {
    const r = await fetch('/api' + path, { method, headers: { 'x-token': TOKEN, 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } catch { state.offline = true; return memApi(path, method, body); }
};

const STORIES = {
  short: { title: 'Delete project?', body: 'This removes the project and its 14 components. You can restore it from the archive for 30 days.' },
  long: { title: 'Delete the whole project and everything inside it?', body: 'This removes the project, its 14 components, 62 stories and every saved comment. You can restore it from the archive for 30 days, after that it is gone for good.' },
};
const TOKENS = {
  padding: { '--space-1': '4px', '--space-2': '8px', '--space-3': '12px', '--space-4': '16px', '--space-5': '20px', '--space-6': '24px' },
  borderRadius: { '--radius-sm': '4px', '--radius-md': '8px', '--radius-lg': '12px', '--radius-full': '999px' },
  fontSize: { '--text-sm': '.875em', '--text-base': '1em', '--text-lg': '1.25em', '--text-xl': '1.5em' },
  size: { '--size-16': '16px', '--size-20': '20px', '--size-24': '24px', '--size-32': '32px', '--size-44': '44px' },
  color: { '--color-surface': '#ffffff', '--color-text': '#15171c', '--color-muted': '#454c58', '--color-primary': '#1f4f9a', '--color-danger': '#b3261e', '--color-border': '#9aa2b1', '--color-subtle': '#d9dde4', '--color-warn': '#8a5a00' },
};
const FLOOR = 24;
const state = { mode: 'test', view: 'parts', width: 390, t200: false, story: 'short', selected: null, comments: [], viewports: [], draft: [], sweep: null, pending: null };
const frame = $('#frame'), stage = $('#stage'), panel = $('#panel'), hl = $('#hl'), pins = $('#pins');

function renderStage() {
  const s = STORIES[state.story];
  stage.innerHTML = `
  <div class="dialog" data-slot="dialog" role="dialog" aria-labelledby="dlg-title" aria-describedby="dlg-body">
    <div class="dialog-head" data-slot="header">
      <h2 class="dialog-title" id="dlg-title" data-slot="title">${esc(s.title)}</h2>
      <button class="dialog-close" data-slot="close" aria-label="Close" type="button">&times;</button>
    </div>
    <p class="dialog-body" id="dlg-body" data-slot="body">${esc(s.body)}</p>
    <div class="dialog-foot" data-slot="footer">
      <button class="btn" data-slot="action" type="button">Cancel</button>
      <button class="btn primary" data-slot="action" type="button">Delete project</button>
    </div>
  </div>`;
  state.selected = null; state.draft = [];
}

/* ---------- helpers ---------- */
const slotOf = (el) => (el && el.closest ? el.closest('[data-slot]') : null);
function selectorOf(el) {
  const slot = el.dataset.slot; const same = $$(`[data-slot="${slot}"]`, stage);
  return same.length > 1 ? `[data-slot="${slot}"]:nth(${same.indexOf(el) + 1})` : `[data-slot="${slot}"]`;
}
const IMPLICIT = { BUTTON: 'button', H2: 'heading', P: 'paragraph', DIV: 'generic' };
const roleOf = (el) => el.getAttribute('role') || IMPLICIT[el.tagName] || 'generic';
function nameOf(el) {
  if (el.getAttribute('aria-label')) return el.getAttribute('aria-label');
  const by = el.getAttribute('aria-labelledby'); if (by && document.getElementById(by)) return document.getElementById(by).textContent.trim();
  return el.textContent.trim().replace(/\s+/g, ' ').slice(0, 60);
}
const boxOf = (el) => { const f = frame.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: Math.round(r.left - f.left), y: Math.round(r.top - f.top), w: Math.round(r.width), h: Math.round(r.height) }; };
const isTarget = (el) => el.tagName === 'BUTTON';
function rgb(c) { const m = c.match(/[\d.]+/g).map(Number); return { r: m[0], g: m[1], b: m[2], a: m[3] === undefined ? 1 : m[3] }; }
const hex = (c) => '#' + [c.r, c.g, c.b].map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
function bgOf(el) { for (let e = el; e && e !== document.body; e = e.parentElement) { const c = rgb(getComputedStyle(e).backgroundColor); if (c.a > 0.99) return c; } return { r: 255, g: 255, b: 255, a: 1 }; }
function lum(c) { const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b); }
const contrast = (a, b) => { const l1 = lum(a), l2 = lum(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); };
function tokenFor(group, value) {
  const t = TOKENS[group]; if (!t) return null;
  for (const [name, v] of Object.entries(t)) { if (group === 'color' ? v === value : v === value) return name; }
  return null;
}
function fontToken(el) {
  const base = parseFloat(getComputedStyle(el.parentElement).fontSize) || 16; const ratio = parseFloat(getComputedStyle(el).fontSize) / base;
  for (const [n, v] of Object.entries(TOKENS.fontSize)) if (Math.abs(parseFloat(v) - ratio) < 0.02) return n + ' (' + v + ')';
  return parseFloat(getComputedStyle(el).fontSize).toFixed(0) + 'px';
}
const breakpoint = (w) => (w < 360 ? 'xs' : w < 640 ? 'sm' : w < 1024 ? 'md' : 'lg');

/* ---------- layout checks (also used by the width sweep) ---------- */
function checkLayout() {
  const f = frame.getBoundingClientRect(); const problems = [];
  $$('[data-slot]', stage).forEach((el) => {
    const r = el.getBoundingClientRect();
    if (r.right > f.right + 0.5 || r.left < f.left - 0.5) problems.push(`${el.dataset.slot} clips the frame by ${Math.round(Math.max(r.right - f.right, f.left - r.left))}px`);
    if (isTarget(el) && (r.width < FLOOR - 0.5 || r.height < FLOOR - 0.5)) problems.push(`${el.dataset.slot} target is ${Math.round(r.width)}x${Math.round(r.height)}px (floor ${FLOOR}px)`);
  });
  if (stage.scrollWidth > stage.clientWidth + 1) problems.push('content wider than the frame');
  return problems;
}

/* ---------- toolbar ---------- */
function setWidth(w) { state.width = Math.max(180, Math.round(w)); frame.style.width = state.width + 'px'; updateToolbar(); drawPins(); }
function updateToolbar() {
  $('#readout').textContent = `${state.width}px · ${breakpoint(state.width)}`;
  $$('#presets button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.w) === state.width)));
  $$('#modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
}
$$('#presets button').forEach((b) => b.addEventListener('click', () => setWidth(Number(b.dataset.w))));
$('#t200').addEventListener('change', (e) => { state.t200 = e.target.checked; frame.classList.toggle('t200', state.t200); drawPins(); renderPanel(); });
$('#story').addEventListener('change', (e) => { state.story = e.target.value; renderStage(); drawPins(); renderPanel(); });
$$('#modes button').forEach((b) => b.addEventListener('click', () => { state.mode = b.dataset.mode; state.selected = null; frame.classList.toggle('parts', state.mode === 'anatomy' && state.view === 'parts'); hl.style.display = 'none'; updateToolbar(); renderPanel(); }));

/* frame resize handle */
const handle = $('#handle');
handle.addEventListener('pointerdown', (e) => { handle.setPointerCapture(e.pointerId); const left = frame.getBoundingClientRect().left; const move = (ev) => setWidth(ev.clientX - left); const up = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); renderPanel(); }; handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); });

/* width sweep: walk down from the current width until the first break */
$('#sweep').addEventListener('click', () => {
  const start = state.width; let lastOk = null; let firstBreak = null;
  for (let w = start; w >= 180; w -= 10) { setWidth(w); const p = checkLayout(); if (p.length) { firstBreak = { w, problems: p }; break; } lastOk = w; }
  state.sweep = { start, lastOk, firstBreak };
  setWidth(start); state.mode = 'test'; updateToolbar(); renderPanel();
});

/* ---------- picking ---------- */
stage.addEventListener('mousemove', (e) => { if (state.mode === 'test') return; const el = slotOf(e.target); if (!el || !stage.contains(el)) { hl.style.display = 'none'; return; } const f = $('.frame-wrap').getBoundingClientRect(), r = el.getBoundingClientRect(); Object.assign(hl.style, { display: 'block', left: r.left - f.left + 'px', top: r.top - f.top + 'px', width: r.width + 'px', height: r.height + 'px' }); });
stage.addEventListener('mouseleave', () => (hl.style.display = 'none'));
stage.addEventListener('click', (e) => { if (state.mode === 'test') return; e.preventDefault(); e.stopPropagation(); const el = slotOf(e.target); if (!el || !stage.contains(el)) return; state.selected = el; state.pending = null; renderPanel(); }, true);

/* ---------- comments ---------- */
async function loadState() { const s = await api('/state'); state.comments = s.comments; state.viewports = s.viewports; drawPins(); renderPanel(); }
function resolve(sel) {
  const m = sel.match(/^\[data-slot="(.+?)"\](?::nth\((\d+)\))?$/);
  return m ? $$(`[data-slot="${m[1]}"]`, stage)[Number(m[2] || 1) - 1] || null : null;
}
function drawPins() {
  const wrap = $('.frame-wrap').getBoundingClientRect(); pins.innerHTML = '';
  state.comments.filter((c) => c.kind !== 'accepted-exception' && c.story === state.story).forEach((c) => { const el = resolve(c.selector); if (!el) return; const r = el.getBoundingClientRect(); const d = document.createElement('div'); d.className = 'pin ' + c.status; d.textContent = c.id.slice(1); d.style.left = r.right - wrap.left + 'px'; d.style.top = r.top - wrap.top + 'px'; pins.appendChild(d); });
}
async function saveComment(text, send) {
  const el = state.selected; const c = await api('/comments', 'POST', { text, story: state.story, viewport: state.width, textScale: state.t200 ? 200 : 100, selector: selectorOf(el), role: roleOf(el), name: nameOf(el), box: boxOf(el), crop: '(prototype) the real build saves a cropped screenshot of the element here', sent: !!send });
  state.comments.push(c); state.selected = null; drawPins(); renderPanel();
}
async function patchComment(id, patch) { const c = await api('/comments/' + id, 'PATCH', patch); state.comments = state.comments.map((x) => (x.id === id ? c : x)); drawPins(); renderPanel(); }

/* ---------- edit mode ---------- */
const FIELDS = [
  { key: 'padding', label: 'Padding', group: 'padding' }, { key: 'borderRadius', label: 'Radius', group: 'borderRadius' },
  { key: 'fontSize', label: 'Text size', group: 'fontSize' }, { key: 'color', label: 'Text colour', group: 'color' },
  { key: 'backgroundColor', label: 'Background', group: 'color' }, { key: 'height', label: 'Height', group: 'size' }, { key: 'width', label: 'Width', group: 'size' },
];
function currentToken(el, f) {
  const cs = getComputedStyle(el);
  if (f.key === 'fontSize') return fontToken(el);
  const v = f.group === 'color' ? hex(rgb(cs[f.key])) : cs[f.key === 'padding' ? 'paddingTop' : f.key];
  const t = tokenFor(f.group, v); return t ? `${t} (${v})` : v;
}
function applyEdit(el, f, tokenName) {
  const before = currentToken(el, f); const sel = selectorOf(el);
  const prop = f.key; el.style[prop] = tokenName ? `var(${tokenName})` : '';
  if (f.key === 'height') el.style.minHeight = '0'; if (f.key === 'width') el.style.minWidth = '0';
  state.draft = state.draft.filter((d) => !(d.selector === sel && d.property === f.key));
  if (tokenName) state.draft.push({ selector: sel, property: f.key, from: before, to: tokenName });
  renderPanel();
}
function editWarnings() {
  const w = [];
  $$('[data-slot]', stage).forEach((el) => {
    const r = el.getBoundingClientRect();
    if (isTarget(el) && (r.width < FLOOR - 0.5 || r.height < FLOOR - 0.5)) w.push({ selector: selectorOf(el), text: `${el.dataset.slot} target is ${Math.round(r.width)}x${Math.round(r.height)}px, below the ${FLOOR}px floor` });
    if (['title', 'body', 'action'].includes(el.dataset.slot) && el.textContent.trim()) { const fg = rgb(getComputedStyle(el).color), bg = bgOf(el); const cr = contrast(fg, bg); if (cr < 4.5) w.push({ selector: selectorOf(el), text: `${el.dataset.slot} text contrast is ${cr.toFixed(1)}:1, below 4.5:1` }); }
  });
  return w;
}

/* ---------- panel ---------- */
function renderPanel() {
  let h = state.offline ? '<p class="note">Demo mode: no helper server is running, so comments and edits live in this tab only. Run <code>node prototypes/preview/server.mjs</code> locally to save them to <code>visual-report/</code>.</p>' : '';
  if (state.sweep) { const s = state.sweep; h += `<h3>Responsive sweep</h3>` + (s.firstBreak ? `<div class="warn">Works down to <strong>${s.lastOk ?? 'n/a'}px</strong>. Breaks at ${s.firstBreak.w}px: ${esc(s.firstBreak.problems.join('; '))}.</div>` : `<div class="good">No break found from ${s.start}px down to 180px.</div>`) + (s.lastOk ? `<button class="plain" id="pin">Pin ${s.lastOk}px as an automated capture</button>` : ''); }
  if (state.viewports.length) h += `<p class="note">Pinned widths: ${state.viewports.map((w) => `<code>${w}px</code>`).join(' ')}</p>`;
  if (state.mode === 'test') h += `<h3>Test</h3><p class="note">Use the component as a user would: Tab through it, press the buttons, change the story, resize the frame, switch to 200% text. Nothing is selected in this mode.</p>` + commentList();
  if (state.mode === 'comment') h += commentPanel();
  if (state.mode === 'anatomy') h += anatomyPanel();
  if (state.mode === 'edit') h += editPanel();
  panel.innerHTML = h; bindPanel();
}
function commentList() {
  const list = state.comments.filter((c) => c.kind !== 'accepted-exception'); const ex = state.comments.filter((c) => c.kind === 'accepted-exception');
  let h = `<h3>Comments (${list.length})</h3>`;
  h += list.map((c) => `<div class="comment"><div><span class="tag ${c.status}">${c.status}</span> <strong>#${c.id.slice(1)}</strong> <code>${esc(c.selector)}</code></div><div>${esc(c.text)}</div><div class="note">${esc(c.role)} “${esc(c.name)}” · ${c.viewport}px · ${c.textScale}% text${c.sent ? ' · sent to Claude' : ''}</div><div><button class="plain" data-act="addressed" data-id="${c.id}">Simulate: Claude addressed it</button> <button class="plain" data-act="resolved" data-id="${c.id}">Mark resolved (you)</button></div></div>`).join('') || '<p class="note">No comments yet.</p>';
  if (ex.length) h += `<h3>Accepted exceptions</h3>` + ex.map((c) => `<div class="comment"><span class="tag resolved">known</span> ${esc(c.text)}</div>`).join('');
  return h;
}
function commentPanel() {
  const el = state.selected;
  let h = `<h3>Comment</h3>`;
  if (!el) h += `<p class="note">Hover an element and click it to attach a comment.</p>`;
  else h += `<div class="row"><span>Element</span><code>${esc(selectorOf(el))}</code></div><div class="row"><span>Role</span><span>${esc(roleOf(el))}</span></div><div class="row"><span>Name</span><span>${esc(nameOf(el))}</span></div><div class="row"><span>Size</span><span>${boxOf(el).w}×${boxOf(el).h}px at ${state.width}px wide, ${state.t200 ? 200 : 100}% text</span></div><textarea id="ctext" aria-label="Comment text" placeholder="What should change here?"></textarea><p><button class="plain" id="csave">Save comment</button> <button class="primary" id="csend">Save and send to Claude</button></p>`;
  return h + commentList();
}
function anatomyPanel() {
  const tabs = ['parts', 'props', 'tokens', 'accessibility']; let h = `<h3>Anatomy</h3><div class="seg" id="views">${tabs.map((t) => `<button type="button" data-view="${t}" aria-pressed="${state.view === t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>`;
  if (state.view === 'parts') h += `<p class="note">Slots outlined in the frame. Names come from the Dialog card.</p><table><tr><th>slot</th><th>element</th><th>role</th></tr>${$$('[data-slot]', stage).map((e) => `<tr><td><code>${e.dataset.slot}</code></td><td>${e.tagName.toLowerCase()}</td><td>${roleOf(e)}</td></tr>`).join('')}</table>`;
  if (state.view === 'props') { const s = state.story; const rows = [['open', 'boolean', 'true'], ['title', 'ReactNode (required)', JSON.stringify($('[data-slot="title"]', stage).textContent)], ['description', 'ReactNode', JSON.stringify($('[data-slot="body"]', stage).textContent.slice(0, 40) + '…')], ['role', "'dialog' | 'alertdialog'", "'dialog'"], ['size', "'sm' | 'md' | 'lg' | 'fullscreen'", "'md'"], ['dismissOnOutsideClick', 'boolean', 'false'], ['showCloseButton', 'boolean', 'true']]; h += `<p class="note">Story: ${s}. Types and JSDoc come from the component source.</p><table><tr><th>prop</th><th>type</th><th>value</th></tr>${rows.map((r) => `<tr><td><code>${r[0]}</code></td><td>${esc(r[1])}</td><td><code>${esc(r[2])}</code></td></tr>`).join('')}</table>`; }
  if (state.view === 'tokens') { const el = state.selected || $('[data-slot="dialog"]', stage); h += `<p class="note">Tokens used by <code>${esc(selectorOf(el))}</code>${state.selected ? '' : ' (click an element to inspect another)'}.</p><table><tr><th>property</th><th>token</th></tr>${FIELDS.filter((f) => f.key !== 'width').map((f) => `<tr><td>${f.label}</td><td><code>${esc(currentToken(el, f))}</code></td></tr>`).join('')}</table>`; }
  if (state.view === 'accessibility') { const focus = $$('button,[tabindex]', stage); h += `<table><tr><th>slot</th><th>role</th><th>name</th><th>size</th></tr>${$$('[data-slot]', stage).map((e) => { const b = boxOf(e); const bad = isTarget(e) && (b.w < FLOOR || b.h < FLOOR); return `<tr><td><code>${e.dataset.slot}</code></td><td>${roleOf(e)}</td><td>${esc(nameOf(e)) || '<em>none</em>'}</td><td>${isTarget(e) ? `<span class="${bad ? 'tag' : ''}" style="${bad ? 'background:#fbe5e6;color:#a3262b' : ''}">${b.w}×${b.h}</span>` : '–'}</td></tr>`; }).join('')}</table><h3>Focus order</h3><ol>${focus.map((f) => `<li>${esc(nameOf(f))}</li>`).join('')}</ol><p class="note">Targets under ${FLOOR}px are flagged. The dialog name comes from its title.</p>`; }
  return h + (state.view === 'tokens' ? '' : '');
}
function editPanel() {
  const el = state.selected; let h = `<h3>Edit</h3>`;
  if (!el) return h + `<p class="note">Click an element to change its text and tokens. Edits are a live draft until you press Apply.</p>` + draftBlock();
  h += `<div class="row"><span>Element</span><code>${esc(selectorOf(el))}</code></div>`;
  if (['title', 'body', 'action'].includes(el.dataset.slot)) h += `<div class="row"><label for="etext">Text</label><input type="text" id="etext" value="${esc(el.textContent.trim())}"></div>`;
  if (el.dataset.slot === 'action') h += `<div class="row"><label for="eintent">Intent</label><select id="eintent"><option value="">neutral</option><option value="primary"${el.classList.contains('primary') ? ' selected' : ''}>primary</option><option value="danger"${el.classList.contains('danger') ? ' selected' : ''}>danger</option></select></div>`;
  FIELDS.forEach((f) => { const opts = Object.entries(TOKENS[f.group]); h += `<div class="row"><label for="f-${f.key}">${f.label}</label><select id="f-${f.key}" data-key="${f.key}"><option value="">${esc(currentToken(el, f))}</option>${opts.map(([n, v]) => `<option value="${n}">${n} (${v})</option>`).join('')}</select></div>`; });
  return h + draftBlock();
}
function draftBlock() {
  const w = editWarnings(); let h = `<h3>Draft (${state.draft.length})</h3>`;
  h += state.draft.map((d) => `<div class="comment"><code>${esc(d.selector)}</code> ${esc(d.property)}: ${esc(d.from)} → <code>${esc(d.to)}</code></div>`).join('') || '<p class="note">No changes yet.</p>';
  h += w.map((x) => `<div class="warn">${esc(x.text)}</div>`).join('');
  if (state.draft.length) h += (w.length ? `<label><input type="checkbox" id="accept"> I accept these accessibility exceptions</label><br>` : '') + `<button class="primary" id="apply" ${w.length ? 'disabled' : ''}>Apply: send to Claude</button> <button class="plain" id="discard">Discard draft</button><p class="note">Apply sends one structured change set. Claude writes it to code using the tokens above.</p>`;
  return h;
}
function bindPanel() {
  const pin = $('#pin'); if (pin) pin.onclick = async () => { state.viewports = await api('/viewports', 'POST', { width: state.sweep.lastOk }); renderPanel(); };
  $$('[data-act]').forEach((b) => (b.onclick = () => patchComment(b.dataset.id, { status: b.dataset.act })));
  const cs = $('#csave'), cd = $('#csend'); if (cs) cs.onclick = () => { const t = $('#ctext').value.trim(); if (t) saveComment(t, false); }; if (cd) cd.onclick = () => { const t = $('#ctext').value.trim(); if (t) saveComment(t, true); };
  $$('#views button').forEach((b) => (b.onclick = () => { state.view = b.dataset.view; frame.classList.toggle('parts', state.view === 'parts'); renderPanel(); }));
  const et = $('#etext'); if (et) et.oninput = () => { state.selected.textContent = et.value; state.draft = state.draft.filter((d) => !(d.selector === selectorOf(state.selected) && d.property === 'text')); state.draft.push({ selector: selectorOf(state.selected), property: 'text', from: '(original)', to: JSON.stringify(et.value) }); $('#panel .comment:last-child')?.remove(); renderDraftOnly(); };
  const ei = $('#eintent'); if (ei) ei.onchange = () => { const el = state.selected; el.classList.remove('primary', 'danger'); if (ei.value) el.classList.add(ei.value); state.draft = state.draft.filter((d) => !(d.selector === selectorOf(el) && d.property === 'intent')); state.draft.push({ selector: selectorOf(el), property: 'intent', from: '(original)', to: ei.value || 'neutral' }); renderPanel(); };
  $$('select[data-key]').forEach((s) => (s.onchange = () => applyEdit(state.selected, FIELDS.find((f) => f.key === s.dataset.key), s.value)));
  const ap = $('#apply'), ac = $('#accept'), ds = $('#discard');
  if (ac && ap) ac.onchange = () => (ap.disabled = !ac.checked);
  if (ds) ds.onclick = () => { const keep = state.selected && selectorOf(state.selected); renderStage(); state.draft = []; renderPanel(); };
  if (ap) ap.onclick = async () => { const warnings = editWarnings(); const accepted = warnings.length > 0; await api('/apply', 'POST', { story: state.story, viewport: state.width, changes: state.draft, warnings, acceptedExceptions: accepted }); if (accepted) for (const x of warnings) { const c = await api('/comments', 'POST', { kind: 'accepted-exception', text: x.text, story: state.story, selector: x.selector, status: 'resolved' }); state.comments.push(c); } state.draft = []; state.selected = null; renderPanel(); panel.insertAdjacentHTML('afterbegin', '<div class="good">Change set sent. Claude would now write it to code.</div>'); };
}
function renderDraftOnly() { const keep = panel.scrollTop; renderPanel(); panel.scrollTop = keep; }

renderStage(); setWidth(390); updateToolbar(); loadState();
</script>
